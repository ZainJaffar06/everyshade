  <text x="145" y="364" text-anchor="middle" font-size="22" font-weight="700" fill="#2B1A12">Often harmless</text>
  <text x="145" y="390" text-anchor="middle" font-size="16" fill="#6B5446">Thin, even, there for years</text>
  <text x="415" y="364" text-anchor="middle" font-size="22" font-weight="700" fill="#2B1A12">Get it checked</text>
