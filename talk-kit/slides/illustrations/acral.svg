  <path d="M152 218 C160 208 176 212 180 222 C188 230 182 244 170 244 C160 250 146 242 148 232 C142 226 146 220 152 218 Z" fill="#2A160C"/>
  <path d="M176 238 C182 236 186 242 182 246 C178 250 172 246 176 238 Z" fill="#5A3420"/>
