  <!-- irregular dark spot on heel -->
  <path d="M410 292 C418 282 434 284 440 292 C452 292 456 306 448 314 C450 326 436 332 426 326 C416 334 402 326 404 316 C394 310 398 296 410 292 Z" fill="#2A160C"/>
  <path d="M434 294 C442 292 448 300 444 306 C440 312 432 308 430 302 C428 298 430 295 434 294 Z" fill="#5A3420"/>
  <text x="140" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#2B1A12">Palm</text>
  <text x="420" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#2B1A12">Sole</text>
  <text x="280" y="434" text-anchor="middle" font-size="18" fill="#2B1A12">A new dark, uneven spot here is worth a doctor visit.</text>
